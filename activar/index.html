<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Activar display · Carteg</title>
<style>
  :root { --bg: #0a0c08; --surface: #14170f; --surface-2: #1d2116; --line: rgba(255,255,255,.12);
    --text: #f4f6ee; --muted: #aeb3a4; --accent: #c9f73a; --on-accent: #0a0c08; --gold: #e9c46a; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 'Segoe UI', Roboto, Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 22px 16px 60px; }
  h1 { font-size: 24px; margin: 0 0 4px; } h2 { font-size: 17px; margin: 0 0 10px; }
  p { margin: 0 0 10px; } a { color: var(--accent); }
  .marca { font-weight: 700; font-size: 19px; margin-bottom: 22px; display: flex; justify-content: space-between; align-items: center; }
  .marca span { color: var(--muted); font-weight: 400; }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .gris { color: var(--muted); font-size: 14px; }
  label { display: grid; gap: 5px; font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  input, select { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 11px 12px; width: 100%; min-height: 46px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 10px 16px; border-radius: 10px; border: 1px solid transparent;
    background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 650; cursor: pointer; text-decoration: none; }
  .btn.sec { background: var(--surface-2); color: var(--text); border-color: var(--line); font-weight: 500; }
  .btn.chico { min-height: 36px; padding: 6px 11px; font-size: 14px; }
  .btn:disabled { opacity: .5; cursor: wait; }
  .ancho { width: 100%; }
  .link { background: none; border: 0; color: var(--muted); text-decoration: underline; font: inherit; font-size: 14px; cursor: pointer; padding: 4px; }
  .error { color: #ffb4a6; font-size: 14px; }
  .ok { background: rgba(201,247,58,.1); border: 1px solid rgba(201,247,58,.4); border-radius: 12px; padding: 13px; margin-bottom: 14px; }
  .aviso { background: rgba(233,196,106,.1); border: 1px solid rgba(233,196,106,.45); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 12px; }
  .fila { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .item { border-top: 1px solid var(--line); padding: 11px 0; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; }
  .item:first-of-type { border-top: 0; }
  .item b { font-variant-numeric: tabular-nums; }
  .item .acciones { grid-column: 1 / -1; display: flex; gap: 6px; }
  code { font-family: ui-monospace, Consolas, monospace; background: var(--surface-2); padding: 1px 6px; border-radius: 5px; }
  .destino { overflow-wrap: anywhere; font-size: 13px; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="marca">Carteg <span id="sesion"></span></div>
  <div id="vista"><p class="gris">Cargando…</p></div>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, setDoc, deleteDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* Configuración pública de Firebase (no es secreta: la seguridad está en las reglas de Firestore) */
const app = initializeApp({
  apiKey: "AIzaSyDqG9wG3Sd1RESGM4ofbIZjEE82PgByz-4",
  authDomain: "carteg.firebaseapp.com",
  projectId: "carteg",
  storageBucket: "carteg.firebasestorage.app",
  messagingSenderId: "298530415356",
  appId: "1:298530415356:web:f848fc8ba2b59e2a9aed79",
});
const DUENO = "Frp9SgAjT7RZ0Gu0sTrqpgiiuZ52";
const auth = getAuth(app), db = getFirestore(app);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const corto = u => String(u || "").replace(/^https:\/\/(www\.)?/, "");
const mesActual = () => new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 7);

/* "14", "c14" o "C014" → "c014" */
function normalizarCodigo(t) {
  t = String(t || "").trim().toLowerCase();
  const m = /^c?0*(\d{1,6})$/.exec(t);
  if (m) return "c" + m[1].padStart(3, "0");
  return /^[a-z0-9-]{1,40}$/.test(t) ? t : "";
}
const codigoUrl = normalizarCodigo(new URLSearchParams(location.search).get("c"));

const TIPOS = {
  "Reseñas": { etiqueta: "Link de Google Maps del local", ayuda: "Tocá “Buscar en Google Maps”, elegí el local → Compartir → Copiar link, y pegalo acá." },
  "Instagram": { etiqueta: "Usuario de Instagram", ayuda: "Por ejemplo: carteg.nfc" },
  "WhatsApp": { etiqueta: "Número de WhatsApp", ayuda: "Por ejemplo: 351 696-7688" },
  "Otro": { etiqueta: "Link", ayuda: "Tiene que empezar con https://" },
};
function normalizarWhatsapp(t) {
  let n = String(t || "").replace(/\D/g, "");
  if (!n) return "";
  if (n.startsWith("0")) n = n.slice(1);
  if (!n.startsWith("54")) n = "549" + n;
  return n;
}
/* Links de Google Maps (Compartir → Copiar link): la web los lee y arma el link oficial de reseñas */
const esLinkGoogle = v => /^https:\/\/(maps\.app\.goo\.gl|goo\.gl|g\.co|(www\.|maps\.)?google\.[a-z.]{2,8})\//i.test(String(v || "").trim());
async function leerLinkMaps(v) {
  let r;
  try { r = await fetch(`/api/lugar?u=${encodeURIComponent(String(v).trim())}`); }
  catch (e) { throw new Error("Sin conexión. Probá de nuevo."); }
  const datos = await r.json().catch(() => ({}));
  if (!r.ok || !datos.link) throw new Error(datos.error || "No se pudo leer ese link de Google Maps.");
  return datos;
}

/* Devuelve [destino, error] */
function armarDestino(tipo, valor) {
  valor = String(valor || "").trim();
  if (tipo === "Instagram") {
    const u = valor.replace(/^@/, "").replace(/^https?:\/\/(www\.)?instagram\.com\//i, "").replace(/[/?#].*$/, "");
    return /^[A-Za-z0-9._]{1,30}$/.test(u) ? [`https://www.instagram.com/${u}/`, ""] : ["", "Ese usuario de Instagram no parece válido."];
  }
  if (tipo === "WhatsApp") {
    const n = normalizarWhatsapp(valor);
    return n.length >= 12 && n.length <= 15 ? [`https://wa.me/${n}`, ""] : ["", "Revisá el número: característica y número, por ejemplo 351 696-7688."];
  }
  if (tipo === "Reseñas") {
    const id = (/^(ChIJ[A-Za-z0-9_-]{10,})$/.exec(valor) || /place_?id[=:](ChIJ[A-Za-z0-9_-]{10,})/i.exec(valor) || [])[1];
    if (id) return [`https://search.google.com/local/writereview?placeid=${id}`, ""];
    if (/google\.[a-z.]+\/search/i.test(valor)) return ["", "Ese es un link de búsqueda de Google y puede vencer. Pegá el código ChIJ o el link de “Pedir reseñas”."];
  }
  let url;
  try { url = new URL(valor); } catch (e) { return ["", "Pegá el link completo, que empiece con https://"]; }
  if (url.protocol !== "https:") return ["", "El link tiene que empezar con https://"];
  return [url.href, ""];
}

/* ---------- Vistas ---------- */
function vistaPublica() {
  $("sesion").innerHTML = "";
  $("vista").innerHTML = `
    <section class="panel">
      <h1>Este display todavía no está activado</h1>
      <p class="gris">${codigoUrl ? `Código <code>${esc(codigoUrl)}</code>. ` : ""}En breve va a llevarte al lugar correcto.</p>
      <a class="btn sec" href="/">Conocé Carteg</a>
    </section>
    <p class="gris"><button class="link" id="irIngresar" type="button">Soy de Carteg: ingresar</button></p>`;
  $("irIngresar").onclick = vistaIngreso;
}

function vistaIngreso() {
  $("vista").innerHTML = `
    <section class="panel">
      <h1>Ingresar</h1>
      <p class="gris">Solo para activar displays de Carteg.</p>
      <form id="fIngreso">
        <label>Mail<input type="email" name="mail" autocomplete="username" required></label>
        <label>Contraseña<input type="password" name="clave" autocomplete="current-password" required></label>
        <p class="error" id="errIngreso" hidden></p>
        <button class="btn ancho" type="submit">Ingresar</button>
      </form>
    </section>`;
  const f = $("fIngreso");
  f.addEventListener("submit", async e => {
    e.preventDefault();
    const b = f.querySelector("button"); b.disabled = true;
    try { await signInWithEmailAndPassword(auth, f.mail.value.trim(), f.clave.value); }
    catch (err) {
      $("errIngreso").textContent = /network/.test(err.code || "") ? "Sin conexión. Probá de nuevo." : "Mail o contraseña incorrectos.";
      $("errIngreso").hidden = false; b.disabled = false;
    }
  });
}

function vistaSinPermiso(usuario) {
  $("vista").innerHTML = `<section class="panel"><h1>Sin permiso</h1><p class="gris">La cuenta ${esc(usuario.email)} no puede activar displays.</p>
    <button class="btn sec" id="salir2" type="button">Salir</button></section>`;
  $("salir2").onclick = () => signOut(auth);
}

let displays = [];
async function cargarDisplays() {
  const snap = await getDocs(collection(db, "displays"));
  displays = snap.docs.map(d => ({ codigo: d.id, ...d.data() })).sort((a, b) => b.codigo.localeCompare(a.codigo));
}

async function vistaDueno(mensaje) {
  $("sesion").innerHTML = `<button class="link" id="salir" type="button">Salir</button>`;
  $("salir").onclick = () => signOut(auth);
  $("vista").innerHTML = `<p class="gris">Cargando displays…</p>`;
  try { await cargarDisplays(); }
  catch (e) { $("vista").innerHTML = `<p class="error">No se pudieron cargar los displays. Revisá la conexión y recargá la página.</p>`; return; }
  const mes = mesActual();
  $("vista").innerHTML = `
    ${mensaje || ""}
    <section class="panel">
      <h1>Activar display</h1>
      <form id="fActivar">
        <label>Código del sticker<input type="text" name="codigo" inputmode="text" autocapitalize="none" placeholder="Por ejemplo: c014" value="${esc(codigoUrl)}" required></label>
        <div id="yaAsignado"></div>
        <label>Cliente<input type="text" name="cliente" maxlength="80" required></label>
        <label>A dónde lleva<select name="tipo">${Object.keys(TIPOS).map(t => `<option>${t}</option>`).join("")}</select></label>
        <div id="filaMaps" class="fila" style="margin:-2px 0 12px"><a class="btn sec chico" id="bMaps" href="https://www.google.com/maps" target="_blank" rel="noopener">Buscar en Google Maps</a></div>
        <label><span id="etiValor"></span><input type="text" name="valor" maxlength="500" autocapitalize="none" required><span class="gris" id="ayudaValor"></span></label>
        <p id="lugar" class="gris" hidden></p>
        <p class="error" id="errActivar" hidden></p>
        <button class="btn ancho" type="submit" id="bActivar">Activar</button>
      </form>
    </section>
    <section class="panel">
      <h2>Displays activados (${displays.length})</h2>
      ${displays.length ? displays.map(d => `<div class="item">
        <div><code>${esc(d.codigo)}</code> ${esc(d.cliente)} · <span class="gris">${esc(d.tipo)}</span><div class="destino">${esc(corto(d.destino))}</div></div>
        <div class="gris" style="text-align:right"><b>${Number(d.toques || 0)}</b> toques<br>${Number((d.mes || {})[mes] || 0)} este mes</div>
        <div class="acciones"><button class="btn sec chico" data-editar="${esc(d.codigo)}" type="button">Editar</button>
          <a class="btn sec chico" href="/r/${esc(d.codigo)}" target="_blank" rel="noopener">Probar</a>
          <button class="link" data-liberar="${esc(d.codigo)}" type="button">Liberar</button></div>
      </div>`).join("") : `<p class="gris">Todavía no activaste ninguno.</p>`}
    </section>`;

  const f = $("fActivar");
  const ajustar = () => {
    $("etiValor").textContent = TIPOS[f.tipo.value].etiqueta;
    $("ayudaValor").textContent = TIPOS[f.tipo.value].ayuda;
    $("filaMaps").hidden = f.tipo.value !== "Reseñas";
    $("bMaps").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(f.cliente.value.trim() || "Córdoba");
  };
  /* Al pegar un link de Maps, muestra qué negocio es para confirmarlo antes de activar */
  let lugarLeido = null, esperaLugar;
  const revisarLugar = () => {
    clearTimeout(esperaLugar); lugarLeido = null;
    const v = f.valor.value.trim(), p = $("lugar");
    if (f.tipo.value !== "Reseñas" || !esLinkGoogle(v)) { p.hidden = true; return; }
    p.hidden = false; p.className = "gris"; p.textContent = "Buscando el local…";
    esperaLugar = setTimeout(async () => {
      try {
        const datos = await leerLinkMaps(v);
        if (f.valor.value.trim() !== v) return;
        lugarLeido = { valor: v, ...datos };
        p.innerHTML = `✓ Reseñas de <b>${esc(datos.nombre || "ese local")}</b>`;
      } catch (e) { p.className = "error"; p.textContent = e.message; }
    }, 400);
  };
  f.valor.addEventListener("input", revisarLugar);
  f.cliente.addEventListener("input", ajustar);
  const mostrarExistente = () => {
    const d = displays.find(x => x.codigo === normalizarCodigo(f.codigo.value));
    $("yaAsignado").innerHTML = d ? `<div class="aviso">Este código ya lleva a <b>${esc(d.cliente)}</b> (${esc(d.tipo)}). Si guardás, se cambia el destino.</div>` : "";
    $("bActivar").textContent = d ? "Cambiar destino" : "Activar";
  };
  f.tipo.addEventListener("change", () => { ajustar(); revisarLugar(); });
  f.codigo.addEventListener("input", mostrarExistente);
  ajustar(); mostrarExistente();
  if (codigoUrl && !displays.some(x => x.codigo === codigoUrl)) f.cliente.focus();

  f.addEventListener("submit", async e => {
    e.preventDefault();
    const err = t => { $("errActivar").textContent = t; $("errActivar").hidden = false; };
    $("errActivar").hidden = true;
    const codigo = normalizarCodigo(f.codigo.value);
    if (!codigo) return err("Revisá el código: es el número que está abajo del QR, por ejemplo c014.");
    const cliente = f.cliente.value.trim();
    if (!cliente) return err("Poné el nombre del cliente.");
    const b = $("bActivar"); b.disabled = true;
    const valor = f.valor.value.trim();
    let destino, lugar = "";
    if (f.tipo.value === "Reseñas" && esLinkGoogle(valor)) {
      try {
        const datos = lugarLeido && lugarLeido.valor === valor ? lugarLeido : await leerLinkMaps(valor);
        destino = datos.link; lugar = datos.nombre || "";
      } catch (e1) { b.disabled = false; return err(e1.message); }
    } else {
      const [d1, problema] = armarDestino(f.tipo.value, valor);
      if (problema) { b.disabled = false; return err(problema); }
      destino = d1;
    }
    try {
      await setDoc(doc(db, "displays", codigo), { cliente, tipo: f.tipo.value, valor, destino, lugar, actualizado: serverTimestamp() }, { merge: true });
      vistaDueno(`<div class="ok"><b>¡Listo! ${esc(codigo)} ya funciona.</b><br><span class="gris">Lleva a ${lugar ? "las reseñas de " + esc(lugar) : esc(corto(destino))}</span><div class="fila" style="margin-top:8px"><a class="btn chico" href="/r/${esc(codigo)}" target="_blank" rel="noopener">Probar ahora</a></div></div>`);
    } catch (e2) {
      b.disabled = false;
      err(/permission/.test(e2.code || "") ? "Tu cuenta no tiene permiso para activar." : "No se pudo guardar. Revisá la conexión y probá de nuevo.");
    }
  });

  $("vista").querySelectorAll("[data-editar]").forEach(b => b.onclick = () => {
    const d = displays.find(x => x.codigo === b.dataset.editar);
    f.codigo.value = d.codigo; f.cliente.value = d.cliente || ""; f.tipo.value = d.tipo in TIPOS ? d.tipo : "Otro"; f.valor.value = d.valor || d.destino || "";
    ajustar(); mostrarExistente(); window.scrollTo({ top: 0, behavior: "smooth" });
  });
  $("vista").querySelectorAll("[data-liberar]").forEach(b => b.onclick = async () => {
    const d = displays.find(x => x.codigo === b.dataset.liberar);
    if (!confirm(`¿Liberar ${d.codigo} de “${d.cliente}”? Ese QR y su chip van a dejar de llevar al cliente en el momento.`)) return;
    try { await deleteDoc(doc(db, "displays", d.codigo)); vistaDueno(`<div class="ok">${esc(d.codigo)} quedó libre.</div>`); }
    catch (e3) { alert("No se pudo liberar. Revisá la conexión."); }
  });
}

/* Pueden activar el dueño y los vendedores con acceso activo */
onAuthStateChanged(auth, async usuario => {
  if (!usuario) return codigoUrl ? vistaPublica() : vistaIngreso();
  if (usuario.uid === DUENO) return vistaDueno();
  try {
    const s = await getDoc(doc(db, "usuarios", usuario.uid));
    const p = s.exists() ? s.data() : null;
    if (p && p.rol === "vendedor" && p.activo !== false) return vistaDueno();
  } catch (e) { console.error(e); }
  vistaSinPermiso(usuario);
});
</script>
</body>
</html>
